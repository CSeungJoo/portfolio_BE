server:
  port: 8888
spring:
  cloud:
    config:
      server:
        git:
          uri: ${GIT_URI}
          default-label: master
          ignore-local-ssh-settings: true
          private-key: ${GIT_PRIVATE_KEY}
          search-paths: config/**
security:
  username: ${CONFIG_USERNAME}
  password: ${CONFIG_PASSWORD}